<nav class="mb-6 border-b border-gray-200">
    <ul class="-mb-px flex gap-6 overflow-x-auto text-sm font-medium">
        {% for key, label in tabs %}
        <li>
            <a href="{% url 'analysis_tab' analysis.pk key %}"
               hx-get="{% url 'analysis_tab' analysis.pk key %}" hx-target="#results-body" hx-push-url="true"
               class="inline-block whitespace-nowrap border-b-2 px-1 pb-3 {% if key == tab %}border-indigo-600 text-indigo-600{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700{% endif %}"
               {% if key == tab %}aria-current="page"{% endif %}>{{ label }}</a>
        </li>
        {% endfor %}
    </ul>
</nav>
{% include tab_template %}
