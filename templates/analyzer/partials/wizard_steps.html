<ol class="flex items-center gap-2 border-b border-gray-200 px-4 py-4 sm:px-6 text-sm">
    {% for num, name in steps %}
    <li class="flex items-center gap-2 {% if not forloop.last %}flex-1{% endif %}">
        {% if num < current %}
            <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-indigo-600 text-white">
                <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 0 1 0 1.4l-8 8a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.4L8 12.58l7.3-7.3a1 1 0 0 1 1.4 0Z" clip-rule="evenodd"/></svg>
            </span>
            <span class="hidden sm:inline font-medium text-gray-900">{{ name }}</span>
        {% elif num == current %}
            <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full border-2 border-indigo-600 font-semibold text-indigo-600">{{ num }}</span>
            <span class="hidden sm:inline font-semibold text-indigo-600">{{ name }}</span>
        {% else %}
            <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full border-2 border-gray-300 text-gray-400">{{ num }}</span>
            <span class="hidden sm:inline text-gray-500">{{ name }}</span>
        {% endif %}
        {% if not forloop.last %}<span class="mx-2 h-px flex-1 {% if num < current %}bg-indigo-600{% else %}bg-gray-200{% endif %}"></span>{% endif %}
    </li>
    {% endfor %}
</ol>
