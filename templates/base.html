{% load static tailwind_cli %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Git Analysis{% endblock %}</title>
    {% tailwind_css %}
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal text-gray-800"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <a href="{% url 'index' %}" class="flex-shrink-0 flex items-center gap-2">
                    <svg class="h-6 w-6 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="9" r="2.5"/>
                        <path d="M6 8.5v7M18 11.5c0 3-4 3.5-9.5 5.5"/>
                    </svg>
                    <span class="text-xl font-bold text-indigo-600">Git Analysis</span>
                </a>
                <div class="flex items-center">
                    <a href="{% url 'index' %}" class="text-sm font-medium text-gray-600 hover:text-indigo-600">New analysis</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
